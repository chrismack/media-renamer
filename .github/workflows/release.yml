name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="media-renamer_${VERSION}_${goos}_${goarch}"
            workdir="build/${name}"
            mkdir -p "$workdir"
            binary="media-renamer"
            if [ "$goos" = "windows" ]; then
              binary="media-renamer.exe"
            fi
            echo "Building $name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o "$workdir/$binary" .
            cp README.md "$workdir/"
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --generate-notes
          fi
