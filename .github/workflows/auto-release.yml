name: Auto Tag and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Determine version and tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version bump and create tag
        id: bump
        run: |
          set -euo pipefail

          last_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            last_tag="v0.0.0"
            range="HEAD"
          else
            range="${last_tag}..HEAD"
          fi

          commits=$(git log "$range" --pretty=format:'%s%n%b' 2>/dev/null || true)

          # Conventional-commit based bump, defaulting to patch when nothing matches:
          #   BREAKING CHANGE / "type!:" -> major
          #   "feat:" / "feat(scope):"   -> minor
          #   anything else (incl. fix)  -> patch
          bump="patch"
          if echo "$commits" | grep -Eiq '(^|[^a-z])BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
            bump="major"
          elif echo "$commits" | grep -Eiq '^feat(\(.+\))?:'; then
            bump="minor"
          fi

          version="${last_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          echo "Bumping $last_tag -> $new_tag ($bump)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$new_tag" -m "Release $new_tag"
          git push origin "$new_tag"

          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

  release:
    name: Build and release
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
