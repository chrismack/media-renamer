name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    # Only Dependabot PRs qualify. All three conditions must hold: the event actor,
    # the pull request author, and the author being a bot account rather than a
    # regular user with a similar-looking name.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot'
    steps:
      # Secondary guard: this action fails if the PR was not produced by Dependabot,
      # so a spoofed branch cannot reach the approval step below.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          approved="$(gh pr view "$PR_URL" \
            --json reviews \
            --jq '[.reviews[] | select(.author.login == "github-actions" and .state == "APPROVED")] | length')"
          if [ "$approved" -gt 0 ]; then
            echo "Pull request already approved by this workflow."
          else
            gh pr review --approve "$PR_URL"
          fi

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
